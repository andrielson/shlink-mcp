# The repo gates plus the full test suite, on every push to main and every
# pull request.
#
# The integration tier starts and stops its own ephemeral Shlink through
# tests/compose.yaml, so the runner needs nothing but Docker (preinstalled on
# ubuntu-latest, with the compose plugin) — no services block and no extra
# env: the suite's defaults match GitHub-hosted Docker, whose daemon is local
# (SHLINK_TEST_HOST=127.0.0.1 is correct there), and bun test owns the compose
# lifecycle itself, generating a fresh per-worktree identity in tests/.env.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A newer run on the same ref supersedes the one it replaces.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: Gates and full test suite
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out
        uses: actions/checkout@v5
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          # The pin lives in package.json's packageManager field.
          bun-version-file: package.json
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Biome check
        run: bun run lint
      - name: Prettier check
        run: bun run format:check
      - name: Type check
        run: bun run typecheck
      - name: ShellCheck
        run: bun run lint:sh
      - name: Test suite (unit, protocol and integration tiers)
        run: bun test
